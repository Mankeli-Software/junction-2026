<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webshop chat: weekly menu on mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E4F68}a:hover{color:#123A4E}
.hd{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:-0.2px;margin:0}
.me{align-self:flex-end;max-width:270px;background:#1E4F68;color:#fff;border-radius:14px 4px 14px 14px;padding:10px 13px;font-size:15px;line-height:1.4}
.bot{align-self:flex-start;max-width:290px;background:#F3F6F8;border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:15px;line-height:1.4}
.dp{flex:1;min-width:0;border-radius:8px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;background:#F3F6F8;border:0;font-family:inherit;color:inherit;cursor:pointer}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;background:#E6F2C2;color:#3F5A00}
.act{flex:1;height:44px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fff; font-family: 'Figtree', system-ui, sans-serif; color: #10303F; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 60px; background: #1E4F68; color: #fff; padding: 0 14px; display: flex; align-items: center; gap: 12px; flex-shrink: 0">
    <div style="width: 36px; height: 36px; border-radius: 18px; background: #2A6582; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px">S</div>
    <div style="display: flex; flex-direction: column; flex-grow: 1"><b style="font-size: 16px">S.I.MO</b><span style="font-size: 13px; color: #CFE0E8">Avoids milk</span></div>
    <button aria-label="Close chat" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #2A6582; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <button style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; border-bottom: 1px solid #DCE3E8; background: #EEE9F5; font: inherit; color: inherit; text-align: left; flex-shrink: 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E4F68" stroke-width="2.2" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>
    <b style="font-size: 15px; flex-grow: 1">Current order</b><span style="font-size: 14px; color: #4A5F6B">No quote yet</span>
  </button>

  <div style="flex-grow: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; justify-content: flex-end">
    <div style="align-self: stretch; border: 1px solid #DCE3E8; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h3 class="hd" style="font-size: 20px; color: #1E4F68">Your week</h3><span style="font-size: 13px; color: #4A5F6B">80 portions</span></div>
      <div style="display: flex; gap: 6px">
        <button class="dp"><b>Mon</b><span>Curry</span></button>
        <button class="dp"><b>Tue</b><span>Meatballs</span></button>
        <button class="dp" style="background: #FFF3B0; outline: 2px solid #E3C200"><b>Wed</b><span>?</span></button>
        <button class="dp"><b>Thu</b><span>Pea soup</span></button>
        <button class="dp"><b>Fri</b><span>Lasagne</span></button>
      </div>
    </div>
    <div class="me">Swap Wednesday for a fish dish.</div>
    <div class="bot">How about this one?</div>
    <div style="align-self: stretch; border: 1px solid #DCE3E8; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 120px; background: #E3E9ED; display: flex; align-items: center; justify-content: center; color: #7D919C; font-size: 13px; font-weight: 600">Recipe photo</div>
      <div style="padding: 12px; display: flex; flex-direction: column; gap: 8px">
        <h3 class="hd" style="font-size: 24px">Salmon soup, milk-free</h3>
        <div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="pill">Milk-free</span><span class="pill">Gluten-free</span><span style="font-size: 13px; color: #4A5F6B; align-self: center">80 portions, 45 min</span></div>
        <div style="display: flex; gap: 8px">
          <button class="act" style="border: 0; background: #1E4F68; color: #fff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Use</button>
          <button class="act" style="border: 1px solid #B9C6CE; background: #fff; color: #1E4F68"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E4F68" stroke-width="2.4" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Other</button>
          <button class="act" aria-label="Show ingredients" style="flex: 0 0 44px; border: 1px solid #B9C6CE; background: #fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E4F68" stroke-width="2.2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 10px 14px 18px 14px; border-top: 1px solid #DCE3E8; display: flex; gap: 8px; flex-shrink: 0">
    <label for="m2" style="position: absolute; left: -9999px">Message S.I.MO</label>
    <input id="m2" placeholder="Write to S.I.MO" style="flex-grow: 1; min-width: 0; height: 46px; box-sizing: border-box; border: 1px solid #B9C6CE; border-radius: 23px; padding: 0 16px; font: inherit; font-size: 15px">
    <button aria-label="Send" style="width: 46px; height: 46px; border-radius: 23px; border: 0; background: #1E4F68; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
  </div>
</div>
</body>
</html>
