# Laptop override: a local Postgres with pgvector, the same major version as the Azure server.
# docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: junction
      POSTGRES_PASSWORD: junction
      POSTGRES_DB: junction
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junction -d junction"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://junction:junction@db:5432/junction
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
