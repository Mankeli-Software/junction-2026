# App containers. The VM runs this file alone against the Azure database (#28).
# Laptops add docker-compose.dev.yml, which brings a local Postgres.
name: junction

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build: ../api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false

  web:
    build: ../web
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost}

volumes:
  caddy_data:
  caddy_config:
