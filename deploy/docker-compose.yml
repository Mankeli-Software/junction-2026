# App containers. The VM runs this file alone against the Azure database (#28).
# Laptops add docker-compose.dev.yml, which brings a local Postgres.
name: junction

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Set on the VM (deploy/vm.env). The API then reads its secrets from Key Vault with the
      # VM's managed identity. Empty on laptops.
      KEY_VAULT_URL: ${KEY_VAULT_URL:-}
      # Engine rule files (#35), mounted read-only so the API can't change its own rules.
      POLICY_DIR: /srv/policy
      DATA_DIR: /srv/data
    volumes:
      - ../policy:/srv/policy:ro
      - ../data:/srv/data:ro

  web:
    build: ../web
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:-http://localhost}
      # The confirmation page reads FastAPI at its address inside Compose. Not secret and the
      # same everywhere, so it lives here. CONFIRMATION_SOURCE=fixture brings back the fake order.
      API_BASE_URL: http://api:8000
      CONFIRMATION_SOURCE: ${CONFIRMATION_SOURCE:-api}

volumes:
  caddy_data:
  caddy_config:
