name: CI

# Runs only when a release is pushed to the production branch (see CLAUDE.md).
on:
  push:
    branches: [production]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: junction
          POSTGRES_PASSWORD: junction
          POSTGRES_DB: junction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junction -d junction"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://junction:junction@localhost:5432/junction
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
