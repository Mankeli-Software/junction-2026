# Core search scenarios (#30, docs/plans/30-product-search.md §6.2). Drafted by Claude from
# the real catalogue, to be reviewed by Miska before the first baseline.
#
# Queries are what a kitchen buyer says on the phone: vague, Finnish or English. Grades:
#   typical:    what a kitchen most likely means. Rank 1 should be one of these.
#   acceptable: same kind, another variant (fat %, brand, pack size). Fine as an option.
#   wrong_kind: matches the words, but is not what was asked. Must not be in the top 5.
# A grade is a selector: `ids`, or `categories` + `name` regex + `not` regex (Postgres ~*,
# on the Finnish and English names). The scenario's claims also apply to typical and
# acceptable. The noisy set is generated from these queries.

# Dairy ----------------------------------------------------------------------------------

- id: milk-lactose-free-claim
  q: laktoositon maito
  claims: [lactose_free]
  note: The headline scenario (valio-api-analysis.md §11). The agent passes the claim.
  typical: {categories: ["10400"], name: "(täys|kevyt|rasvaton|^valio |^arla )?maito(juoma)?\\M", not: "kahvi|caf[eéè]|annos|piimä|kaakao|suklaa|jauhe"}
  acceptable: {categories: ["10400"], not: "piimä|kaakao|suklaa"}
  wrong_kind: {name: "kahvimaito|caf[eéè] maito|annosmaito|kondensoitu|jogurtti|rahka|kaakao|suklaa|maitojauhe"}

- id: milk-lactose-free-text
  q: laktoositon maito
  note: The same request when the agent does not turn "laktoositon" into a claim.
