[project]
name = "junction-api"
version = "0.1.0"
description = "S.I.MO ordering engine, MCP server and REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "joserfc>=1.8.0",
    "mcp>=1.30.0,<2",
    "phonenumbers>=9.0.43",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
